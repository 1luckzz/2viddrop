<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meekz Drop — baixe vídeos por link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Azeret+Mono:wght@400..700&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('meekz-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <button type="button" id="themeToggle" class="theme-toggle"
          aria-label="Mudar para acabamento escuro">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <main class="deck">

    <header class="deck-head">
      <h1 class="logo">Meekz Drop</h1>
      <!-- O LED reflete o estado real da página via :has() — ver style.css -->
      <div class="lamp" aria-hidden="true">
        <span class="lamp-led"></span>
        <span class="lamp-text"></span>
      </div>
    </header>

    <div class="mode-switch" role="tablist" aria-label="Tipo de download">
      <button type="button" id="modeM3u8" class="mode-btn is-active"
              role="tab" aria-selected="true" aria-controls="paneM3u8">XVIDEOS/M3U8</button>
      <button type="button" id="modeTwitter" class="mode-btn"
              role="tab" aria-selected="false" aria-controls="paneTwitter">Twitter</button>
    </div>

    <!-- Painel M3U8 — conteúdo original, apenas envolvido para poder alternar -->
    <div id="paneM3u8" role="tabpanel">
    <div class="panel">
      <label class="field-label" for="urlInput">Link do vídeo</label>
      <div class="box">
        <input type="text" id="urlInput" placeholder="cole o link aqui"
               autocomplete="off" spellcheck="false" />
        <button id="dlBtn" onclick="startDownload()">Baixar</button>
      </div>
      <p class="field-hint">Página de vídeo, playlist ou link direto <code>.m3u8</code></p>
    </div>

    <div class="meter">
      <span class="field-label">Transferência</span>
      <div class="bar-track"><div id="bar" class="bar-fill"></div></div>
      <div id="progress" class="progress hidden">
        <div class="readout">
          <span id="status" class="readout-status">Iniciando...</span>
          <span id="pct" class="readout-pct"></span>
        </div>
        <div class="readout readout-foot">
          <span id="speed" class="readout-speed"></span>
          <button type="button" id="cancelBtn" class="cancel-btn"
                  onclick="cancelCurrentJob()">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="playlist" class="playlist hidden"></div>
    <p id="error" class="error hidden"></p>
    </div><!-- /paneM3u8 -->

    <!-- Painel Twitter/X — independente: IDs próprios, nada compartilhado -->
    <div id="paneTwitter" class="hidden" role="tabpanel">
      <h2 class="tw-title">Baixar vídeo do Twitter/X</h2>

      <label class="field-label" for="twInput">Link do post</label>
      <div class="box">
        <input type="text" id="twInput" placeholder="Cole o link do post do Twitter/X"
               autocomplete="off" spellcheck="false" />
        <button type="button" id="twBtn">Adicionar</button>
      </div>
      <p class="field-hint">Cole um ou vários links — cada um entra na fila e já é buscado</p>

      <p id="twErro" class="error hidden"></p>

      <div id="twFila" class="tw-fila hidden">
        <div class="tw-fila-head">
          <span id="twCount"></span>
          <button type="button" id="twLimpar" class="tw-link">Limpar fila</button>
        </div>
        <div id="twLista" class="tw-lista"></div>
        <div class="tw-fila-foot">
          <button type="button" id="twBaixarTodos" class="tw-acao"></button>
        </div>
      </div>
    </div>

  </main>
  <script src="theme.js"></script>
  <script src="app.js?v=10"></script>
  <script src="twitter.js?v=1"></script>
</body>
</html>
